# ---------------------------------------------------------------
# Java-Based Online Quiz Platform - database configuration
# Loaded from the classpath (src/main/resources/config.properties)
# This file is packaged INTO the WAR, so set your MySQL password here
# BEFORE building for production (see docs/PRODUCTION_DEPLOYMENT.md).
# ---------------------------------------------------------------
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/java_quiz_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
db.user=root
# --- EDIT THIS: replace with your own MySQL password ---
db.password=root
